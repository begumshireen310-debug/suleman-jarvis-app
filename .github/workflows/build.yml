name: Build APK from ZIP
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SULEMAN-JARVIS-AI.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - working-directory: proj/SulemanJarvisAI
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SULEMAN-JARVIS-AI-apk
          path: proj/SulemanJarvisAI/app/build/outputs/apk/debug/app-debug.apk
